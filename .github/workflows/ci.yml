# SPDX-License-Identifier: Apache-2.0
# Tests on every supported Python, then an sdist and a wheel.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # 3.14 is the python3 of Ubuntu 26.04, which SOS is built on
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests (standard library only, no network, no PyTorch)
        run: python -m unittest discover -s tests -v
      - name: Neural examples and nn helpers on microtorch (numpy stands in for PyTorch)
        run: |
          python -m pip install "numpy>=1.26,<3"
          python -m unittest discover -s tests -p "test_runtime_v03.py" -v
          python -m unittest discover -s tests -p "test_examples.py" -v
      - name: Editor grammars match upsil/keywords.py
        run: python tools/gen_syntax.py --check
      - name: Examples pass upsil check
        run: python -m upsil check examples/*.upl

  build:
    name: Build sdist and wheel
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install "build==1.2.2.post1"
          python -m build
      - name: Install the wheel and run an example
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/venv/bin/upsil" run "$GITHUB_WORKSPACE/examples/hello.upl"
      - name: Run the tests from the sdist
        run: |
          mkdir "$RUNNER_TEMP/sdist"
          tar xzf dist/*.tar.gz -C "$RUNNER_TEMP/sdist"
          cd "$RUNNER_TEMP"/sdist/upsil-*
          python -m unittest discover -s tests
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error
